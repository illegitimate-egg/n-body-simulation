name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            artifact_name: butt-gravity-linux-x64
            rustflags: "-C target-cpu=x86-64-v2"

          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
            artifact_name: butt-gravity-windows-x64
            rustflags: "-C target-cpu=x86-64-v2"

          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            artifact_name: butt-gravity-macos-arm64
            rustflags: "-C target-cpu=generic"

          - os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
            artifact_name: butt-gravity-macos-x64
            rustflags: "-C target-cpu=x86-64"
            macos_deployment_target: "11.0"

    runs-on: ${{ matrix.os }}
    
    env:
        MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        RUSTFLAGS: ${{ matrix.rustflags }}
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && apt-get install -y libasound2-dev
        
      - name: Build
        run: cargo build --profile dist --target ${{ matrix.target }}
        
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          
          cp target/${{ matrix.target }}/dist/butt-gravity dist/
          
          cp README.md dist/
          cp LICENSE.md dist/
          
          tar -czf \
            ${{ matrix.artifact_name }}.tar.gz \
            dist
            
      - name: Prepare artifact (Windows)      
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          mkdir dist

          copy target\${{ matrix.target }}\dist\butt-gravity.exe dist\
          copy README.md dist\
          copy LICENSE.md dist\

          Compress-Archive `
            -Path dist\* `
            -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
            
  build-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable # Wasm's mind collapses on nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Build wasm
        run: cargo +stable build --profile dist --target wasm32-unknown-unknown

      - name: Prepare web bundle
        run: |
          mkdir web-dist

          cp target/wasm32-unknown-unknown/dist/butt-gravity.wasm web-dist/
          cp web/index.html web-dist/

          mkdir web-dist/assets
          cp -r web/assets/* web-dist/assets/

          cd web-dist
          zip -r ../butt-gravity-web.zip .

      - name: Upload web release
        uses: softprops/action-gh-release@v2
        with:
          files: butt-gravity-web.zip

      - name: Upload pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: web-dist
          
  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download built pages
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages
          force_orphan: true
